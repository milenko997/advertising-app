name: Backup now

# Manual button (Actions -> Backup now -> Run workflow) that runs the same deploy/backup.sh
# as the nightly cron on the server, then lists the latest snapshots.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    name: Backup
    runs-on: ubuntu-24.04
    steps:
      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Run backup
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          for name in SSH_HOST SSH_USER DEPLOY_PATH; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set (Settings -> Secrets and variables -> Actions)."
              exit 1
            fi
          done

          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            bash -s -- "$DEPLOY_PATH" <<'REMOTE' | tee snapshots.txt
          set -euo pipefail
          APP="$1" BACKUP_TAG=manual bash "$1/current/deploy/backup.sh"
          set -a; . "${BACKUP_CONFIG:-$HOME/.config/transporteri-backup.env}"; set +a
          restic snapshots --latest 5
          REMOTE

          {
            echo '### Backup done'
            echo '```'
            cat snapshots.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
